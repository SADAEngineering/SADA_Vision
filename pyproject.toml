[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sada-vision"
version = "0.1.0"
description = "SADA Vision - Erkennung und Vermessung von Rissen, Schrauben und Korrosion auf Bauteilfotos"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# Laufzeit des Dienstes. Bewusst ohne torch: serviert wird ONNX.
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "numpy>=1.26,<3",
  "opencv-contrib-python-headless>=4.10",  # contrib wegen cv2.aruco
  "scikit-image>=0.24",
  "scipy>=1.13",
  "pillow>=10.4",
  "onnxruntime>=1.19",
  "structlog>=24.4",
]

[project.optional-dependencies]
# Nur fuer Training und Export - kommt nie in das Dienst-Image.
train = [
  "torch>=2.4",
  "torchvision>=0.19",
  "segmentation-models-pytorch>=0.3.4",
  "albumentations>=1.4",
  "tqdm>=4.66",
  "pyyaml>=6.0",
  "onnx>=1.16",
  "onnxsim>=0.4.36",
  "requests>=2.32",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
